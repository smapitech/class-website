<html lang="en">

</head>

<body>

  <header>
    <h1>Ahmad's Page</h1>
    <p>This page was created on my own branch.</p>
  </header>

  <main>
    <section class="card">
      <h2>My Coding Goal</h2>

      <p>
        I want to learn how to build games, websites, and useful apps.
      </p>

      <h2>Colour Changer</h2>

      <p>
        Click a button to change the background colour.
      </p>

      <button onclick="makeBlue()">Blue</button>
      <button onclick="makeGreen()">Green</button>
      <button onclick="resetColour()">Reset</button>

      <br>

      <a class="back-link" href="index.html">Back to Home</a>
    </section>

  <footer>
    <p>Created by Ahmad</p>

  <script>
    function makeBlue() {
      document.body.style.backgroundColor = "lightblue";
    }

    function makeGreen() {
      document.body.style.backgroundColor = "lightgreen";
    }

    function resetColour() {
      document.body.style.backgroundColor = "#f3f7f6";
    }
  </script>
